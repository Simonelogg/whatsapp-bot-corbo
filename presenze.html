<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenze - Centro Dentale Corbo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
    :root {
        --blu: #0d47a1; --blu-2: #1565c0; --blu-chiaro: #e8f0fe;
        --testo: #0f172a; --testo-2: #475569; --testo-3: #94a3b8;
        --bordo: #e2e8f0; --bordo-2: #cbd5e1; --sfondo: #f4f6fa; --carta: #fff;
        --P: #16a34a; --P-bg: #dcfce7; --F: #2563eb; --F-bg: #dbeafe; --R: #7c3aed; --R-bg: #ede9fe;
        --EF: #0891b2; --EF-bg: #cffafe; --M: #db2777; --M-bg: #fce7f3; --A: #b45309; --A-bg: #fef3c7;
        --KO: #dc2626; --KO-bg: #fee2e2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, 'Segoe UI', Arial, sans-serif; background: var(--sfondo); color: var(--testo); font-size: 14px; }
    button { font-family: inherit; }

    /* Barra superiore */
    .top { background: linear-gradient(90deg, var(--blu), var(--blu-2)); color: #fff; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 8px rgba(13,71,161,.25); }
    .top-in { max-width: 1500px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; gap: 24px; min-height: 60px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; white-space: nowrap; }
    .brand small { display: block; font-weight: 400; font-size: 11px; opacity: .75; }
    .logo { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-size: 18px; }
    nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
    nav button { background: transparent; color: rgba(255,255,255,.8); border: 0; padding: 9px 14px; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 8px; }
    nav button:hover { background: rgba(255,255,255,.1); color: #fff; }
    nav button.on { background: #fff; color: var(--blu); font-weight: 700; }
    .esci { background: rgba(255,255,255,.15); color: #fff; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; }

    main { max-width: 1500px; margin: 0 auto; padding: 22px 20px 40px; }
    .titolo { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .titolo h2 { margin: 0; font-size: 22px; }
    .titolo p { margin: 4px 0 0; color: var(--testo-2); }
    .card { background: var(--carta); border: 1px solid var(--bordo); border-radius: 12px; padding: 18px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
    .card h3 { margin: 0 0 14px; font-size: 16px; }
    .muted { color: var(--testo-2); font-size: 12.5px; }

    /* Indicatori */
    .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .kpi div { background: var(--carta); border: 1px solid var(--bordo); border-radius: 12px; padding: 14px 16px; border-left: 4px solid var(--c, var(--blu)); }
    .kpi b { display: block; font-size: 28px; line-height: 1.1; }
    .kpi span { color: var(--testo-2); font-size: 13px; }

    /* Tabelle */
    .tab-wrap { overflow-x: auto; border: 1px solid var(--bordo); border-radius: 10px; }
    table.t { width: 100%; border-collapse: collapse; background: #fff; }
    table.t th { background: #f8fafc; color: var(--testo-2); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--bordo); white-space: nowrap; position: sticky; top: 0; }
    table.t td { padding: 11px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    table.t tbody tr:hover td { background: #f8fbff; }
    table.t tbody tr:last-child td { border-bottom: 0; }
    table.t .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    table.t tfoot td { background: #f8fafc; font-weight: 700; border-top: 1px solid var(--bordo); }
    .nome { font-weight: 600; }
    .sub { display: block; color: var(--testo-3); font-size: 12px; font-weight: 400; margin-top: 2px; }
    .neg { color: var(--KO); }

    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
    .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .s-P { background: var(--P-bg); color: var(--P); } .s-F { background: var(--F-bg); color: var(--F); }
    .s-R { background: var(--R-bg); color: var(--R); } .s-EF { background: var(--EF-bg); color: var(--EF); }
    .s-M { background: var(--M-bg); color: var(--M); } .s-A { background: var(--A-bg); color: var(--A); }
    .s-KO { background: var(--KO-bg); color: var(--KO); } .s-OFF { background: #f1f5f9; color: var(--testo-3); }

    /* Scheda mensile */
    .foglio { border-collapse: separate; border-spacing: 0; font-size: 12.5px; background: #fff; }
    .foglio th, .foglio td { border-right: 1px solid var(--bordo); border-bottom: 1px solid var(--bordo); text-align: center; }
    .foglio thead th { background: #f8fafc; padding: 6px 0; font-weight: 600; color: var(--testo-2); position: sticky; top: 0; z-index: 2; }
    .foglio thead th .gs { display: block; font-size: 10px; font-weight: 500; color: var(--testo-3); text-transform: uppercase; }
    .foglio .col-nome { position: sticky; left: 0; z-index: 3; background: #fff; text-align: left; padding: 6px 12px; min-width: 185px; max-width: 185px; border-right: 2px solid var(--bordo-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .foglio .col-nome .nome { display: block; overflow: hidden; text-overflow: ellipsis; }
    .foglio thead .col-nome { background: #f8fafc; z-index: 4; }
    .foglio td.g { width: 29px; min-width: 29px; height: 40px; padding: 0; cursor: pointer; font-weight: 700; font-size: 11.5px; }
    .foglio td.g:hover { outline: 2px solid var(--blu); outline-offset: -2px; }
    .foglio .we { background: #f8fafc; }
    .foglio th.oggi { background: var(--blu); color: #fff; } .foglio th.oggi .gs { color: #cfe0ff; }
    .foglio td.oggi { box-shadow: inset 2px 0 0 var(--blu), inset -2px 0 0 var(--blu); }
    .foglio td.tot { min-width: 36px; padding: 0 4px; font-weight: 700; background: #f8fafc; font-variant-numeric: tabular-nums; }
    .foglio th.tot { min-width: 36px; padding: 6px 4px; }
    .foglio .sep { border-left: 2px solid var(--bordo-2); }
    .c-P { background: var(--P-bg); color: var(--P); } .c-F { background: var(--F-bg); color: var(--F); }
    .c-R { background: var(--R-bg); color: var(--R); } .c-EF { background: var(--EF-bg); color: var(--EF); }
    .c-M { background: var(--M-bg); color: var(--M); } .c-A { background: var(--A-bg); color: var(--A); }
    .c-KO { background: #fff; color: var(--KO); box-shadow: inset 0 0 0 1.5px #fca5a5; } .c-OFF { color: #cbd5e1; font-weight: 400; }
    .legenda { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 12.5px; color: var(--testo-2); }
    .legenda span { display: inline-flex; align-items: center; gap: 6px; }
    .legenda i { font-style: normal; display: inline-grid; place-items: center; width: 24px; height: 20px; border-radius: 4px; font-weight: 700; font-size: 11px; }
    .manuale::after { content: '•'; position: relative; top: -6px; font-size: 10px; }

    /* Menu rapido sulla casella */
    #pop { position: fixed; z-index: 50; background: #fff; border: 1px solid var(--bordo); border-radius: 10px; box-shadow: 0 10px 30px rgba(15,23,42,.18); padding: 8px; min-width: 230px; display: none; }
    #pop .h { padding: 6px 8px 8px; border-bottom: 1px solid var(--bordo); margin-bottom: 6px; font-weight: 600; }
    #pop .h small { display: block; color: var(--testo-2); font-weight: 400; }
    #pop button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 13.5px; color: var(--testo); }
    #pop button:hover { background: var(--blu-chiaro); }
    #pop button.rosso { color: var(--KO); }

    /* Moduli */
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .row label { display: flex; flex-direction: column; font-size: 12px; font-weight: 600; color: var(--testo-2); gap: 5px; }
    input, select { padding: 9px 11px; border: 1px solid var(--bordo-2); border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; color: var(--testo); }
    input:focus, select:focus { outline: 2px solid var(--blu-chiaro); border-color: var(--blu); }
    .b { padding: 9px 16px; border: 0; border-radius: 8px; background: var(--blu); color: #fff; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; }
    .b:hover { background: var(--blu-2); }
    .b2 { background: #eef2f7; color: var(--testo); } .b2:hover { background: #e2e8f0; }
    .link { background: none; border: 0; color: var(--blu); cursor: pointer; font-size: 13px; font-weight: 600; padding: 4px 6px; border-radius: 6px; }
    .link:hover { background: var(--blu-chiaro); } .link.rosso { color: var(--KO); } .link.rosso:hover { background: var(--KO-bg); }
    .codice { font-family: ui-monospace, Consolas, monospace; font-size: 16px; font-weight: 700; letter-spacing: 2px; background: #f1f5f9; padding: 3px 8px; border-radius: 6px; }

    #login { max-width: 360px; margin: 12vh auto; text-align: center; }
    #login .logo { margin: 0 auto 12px; width: 52px; height: 52px; font-size: 26px; background: var(--blu-chiaro); }
    #login input { width: 100%; margin: 14px 0 10px; text-align: center; font-size: 18px; }
    #login .b { width: 100%; padding: 12px; }
    .hidden { display: none !important; }
    #qr { display: inline-block; padding: 18px; background: #fff; border: 1px solid var(--bordo); border-radius: 12px; }
    #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 11px 18px; border-radius: 10px; font-weight: 500; z-index: 60; display: none; }

    @media print {
        @page { size: A4 landscape; margin: 8mm; }
        body { background: #fff; font-size: 11px; }
        .top, .noprint, #pop { display: none !important; }
        main { padding: 0; max-width: none; }
        .card { border: 0; box-shadow: none; padding: 0; }
        .tab-wrap { overflow: visible; border: 0; }
        .foglio td.g { width: 22px; min-width: 22px; height: 22px; font-size: 9px; }
        .foglio .col-nome { min-width: 150px; max-width: 150px; padding: 4px 6px; position: static; }
        .foglio thead th { position: static; }
        * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    @media (max-width: 700px) { .top-in { padding: 8px 12px; gap: 8px; } main { padding: 16px 12px; } nav button { padding: 7px 9px; font-size: 13px; } }
</style>
</head>
<body>
<div id="login" class="card">
    <div class="logo">🦷</div>
    <h2 style="margin:0;">Presenze</h2>
    <div class="muted">Centro Dentale Corbo</div>
    <input type="password" id="pwd" placeholder="Password" autocomplete="current-password">
    <button class="b" id="btn-login">Entra</button>
    <div id="login-err" class="neg" style="margin-top:10px;"></div>
</div>

<div id="app" class="hidden">
<div class="top"><div class="top-in">
    <div class="brand"><div class="logo">🦷</div><div>Presenze<small>Centro Dentale Corbo</small></div></div>
    <nav id="nav">
        <button data-v="oggi" class="on">Oggi</button><button data-v="foglio">Scheda mensile</button><button data-v="mese">Per dipendente</button>
        <button data-v="assenze">Ferie e assenze</button><button data-v="saldi">Saldi</button><button data-v="dip">Dipendenti</button><button data-v="imp">Impostazioni</button>
    </nav>
    <button class="esci" id="btn-esci" title="Esci">Esci</button>
</div></div>
<main>
    <section id="v-oggi"></section>
    <section id="v-foglio" class="hidden"></section>
    <section id="v-mese" class="hidden"></section>
    <section id="v-assenze" class="hidden"></section>
    <section id="v-saldi" class="hidden"></section>
    <section id="v-dip" class="hidden"></section>
    <section id="v-imp" class="hidden"></section>
</main>
</div>
<div id="pop"></div>
<div id="toast"></div>

<script>
let TOKEN = sessionStorage.getItem('presenzeToken') || '';
let D = null; // dati dal server
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const GIORNI = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
const INIZIALI = ['D', 'L', 'M', 'M', 'G', 'V', 'S'];
const TIPI = { ferie: 'Ferie', rol: 'Permesso ROL', exfest: 'Ex festività', malattia: 'Malattia', altro: 'Altra assenza' };
const SIGLA = { ferie: 'F', rol: 'R', exfest: 'EF', malattia: 'M', altro: 'A' };
const num = (n) => (Math.round(n * 100) / 100).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dataIt = (g) => new Date(g + 'T12:00').toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const dataBreve = (g) => new Date(g + 'T12:00').toLocaleDateString('it-IT');

function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { e.style.display = 'none'; }, 2500); }
async function api(url, opt = {}) {
    const r = await fetch(url, Object.assign({}, opt, { headers: { 'Content-Type': 'application/json', 'x-presenze-token': TOKEN } }));
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && url !== '/presenze/api/login') { esci(); throw new Error(j.error || 'Sessione scaduta.'); }
    if (!r.ok) throw new Error(j.error || 'Errore.');
    return j;
}
function esci() { TOKEN = ''; sessionStorage.removeItem('presenzeToken'); $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }
async function login() {
    try {
        const r = await api('/presenze/api/login', { method: 'POST', body: JSON.stringify({ password: $('pwd').value }) });
        TOKEN = r.token; sessionStorage.setItem('presenzeToken', TOKEN);
        await avvia();
    } catch (e) { $('login-err').textContent = e.message; }
}
$('btn-login').addEventListener('click', login);
$('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('btn-esci').addEventListener('click', esci);

// ---------- Calcoli (ora locale del browser = ora italiana) ----------
const giorno = (d) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
const OGGI = () => giorno(new Date());
const dip = (id) => D.dipendenti.find(d => d.id === id);
const nomeDip = (d) => `${d.cognome.toUpperCase()} ${d.nome}`;
function giorniTra(dal, al) { const out = []; for (let d = new Date(dal + 'T12:00'); giorno(d) <= al; d.setDate(d.getDate() + 1)) out.push(giorno(d)); return out; }
// Ore previste in un giorno: null se senza orario fisso
function previste(d, g) {
    const dow = new Date(g + 'T12:00').getDay();
    if (!d.orario) return null;
    return dow === 0 ? 0 : (d.orario[dow] || 0);
}
const lavorativo = (d, g) => { const p = previste(d, g); const dow = new Date(g + 'T12:00').getDay(); return p == null ? (dow >= 1 && dow <= 5) : p > 0; };
const presenza = (id, g) => D.presenze.find(p => p.dip === id && p.giorno === g);
function assenzeDi(id, g) { return D.assenze.filter(a => a.dip === id && a.dal <= g && a.al >= g); }
// Stato di un giorno. codice: P presente, F/R/EF/M/A assenza registrata, KO assente senza giustificazione,
// OFF non in turno, FUT giorno futuro senza nulla.
function statoGiorno(d, g) {
    const p = presenza(d.id, g), ass = assenzeDi(d.id, g);
    if (p) return { codice: 'P', sigla: 'P', testo: 'Presente' + (p.manuale ? ' (segnata a mano)' : ''), p };
    // Un'assenza lunga che copre un sabato o un giorno fuori turno non va contata quel giorno
    if (ass.length && lavorativo(d, g)) return { codice: SIGLA[ass[0].tipo], sigla: SIGLA[ass[0].tipo], testo: ass.map(a => TIPI[a.tipo] + (a.nota ? ': ' + a.nota : '')).join(', '), ass };
    if (!lavorativo(d, g)) return { codice: 'OFF', sigla: '·', testo: 'Non in turno' };
    if (g > OGGI()) return { codice: 'FUT', sigla: '', testo: 'Da venire' };
    return { codice: 'KO', sigla: '✕', testo: 'Assente senza giustificazione' };
}
// Consumo di un'assenza sui saldi: ferie in giorni, ROL ed ex festivita' in ore.
// Conta solo i giorni dopo la data dei saldi iniziali. Una "quantita'" indicata a mano vince sul calcolo.
function consumo(a) {
    const d = dip(a.dip); if (!d) return 0;
    const dopo = giorniTra(a.dal, a.al).filter(g => !d.saldi.al || g > d.saldi.al);
    if (!dopo.length) return 0;
    if (a.quantita > 0) return a.quantita;
    const lav = dopo.filter(g => lavorativo(d, g));
    if (a.tipo === 'rol' || a.tipo === 'exfest') return lav.reduce((s, g) => s + (previste(d, g) ?? 8), 0);
    return lav.length;
}
function saldo(d) {
    const usato = { ferie: 0, rol: 0, exfest: 0 };
    D.assenze.filter(a => a.dip === d.id && usato[a.tipo] != null).forEach(a => { usato[a.tipo] += consumo(a); });
    return { usato, residuo: { ferie: d.saldi.ferie - usato.ferie, rol: d.saldi.rol - usato.rol, exfest: d.saldi.exfest - usato.exfest } };
}
const BREVI = ['D', 'L', 'Ma', 'Me', 'G', 'V', 'S'];
const orarioBreve = (d) => !d.orario ? 'Libero' : [1, 2, 3, 4, 5, 6].filter(g => d.orario[g] > 0).map(g => `${BREVI[g]}${d.orario[g]}`).join(' ') || '—';
const orarioTesto = (d) => !d.orario ? 'Senza orario fisso' : [1, 2, 3, 4, 5, 6].filter(g => d.orario[g] > 0).map(g => `${GIORNI[g]} ${d.orario[g]}h`).join(' · ') || '—';
const attivi = () => D.dipendenti.filter(d => d.attivo).sort((a, b) => nomeDip(a).localeCompare(nomeDip(b)));
const opzDip = (sel) => attivi().map(d => `<option value="${d.id}" ${d.id === sel ? 'selected' : ''}>${esc(nomeDip(d))}</option>`).join('');
const pill = (s) => s.codice === 'FUT' ? '' : `<span class="pill s-${s.codice}">${esc(s.testo)}</span>`;
function giorniMese(mese) {
    const [y, m] = mese.split('-').map(Number);
    return Array.from({ length: new Date(y, m, 0).getDate() }, (_, i) => `${mese}-${String(i + 1).padStart(2, '0')}`);
}
const nomeMese = (mese) => { const [y, m] = mese.split('-').map(Number); const s = new Date(y, m - 1).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); };
function scaricaCsv(nome, righe) {
    const csv = '﻿' + righe.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = nome; a.click();
}

// ---------- Azioni rapide su un giorno ----------
async function segnaPresente(dipId, g) {
    const nota = prompt('Motivo della presenza segnata a mano (es. telefono scarico)');
    if (nota === null) return;
    try { await api('/presenze/api/presenze', { method: 'POST', body: JSON.stringify({ dip: dipId, giorno: g, nota }) }); toast('Presenza segnata.'); await ricarica(); }
    catch (e) { alert(e.message); }
}
async function togliPresenza(p) {
    if (!confirm('Togliere la presenza di questo giorno?')) return;
    await api('/presenze/api/presenze/' + p.id, { method: 'DELETE' }); toast('Presenza tolta.'); await ricarica();
}
async function assenzaGiorno(dipId, g, tipo) {
    try { await api('/presenze/api/assenze', { method: 'POST', body: JSON.stringify({ dip: dipId, tipo, dal: g, al: g }) }); toast(TIPI[tipo] + ' registrata.'); await ricarica(); }
    catch (e) { alert(e.message); }
}
async function eliminaAssenza(a) {
    if (!confirm(`Eliminare ${TIPI[a.tipo]} dal ${dataBreve(a.dal)} al ${dataBreve(a.al)}? Il saldo viene ricalcolato.`)) return;
    await api('/presenze/api/assenze/' + a.id, { method: 'DELETE' }); toast('Assenza eliminata.'); await ricarica();
}
function apriPop(el, d, g) {
    const s = statoGiorno(d, g), pop = $('pop');
    let azioni = '';
    if (s.p) azioni += `<button class="rosso" data-a="togli">✕ Togli presenza</button>`;
    else if (!s.ass && g <= OGGI()) azioni += `<button data-a="presente">✓ Segna presente</button>`;
    if (!s.p && !s.ass) azioni += Object.keys(TIPI).map(t => `<button data-a="ass" data-t="${t}"><span class="pill s-${SIGLA[t]}" style="padding:1px 7px;">${SIGLA[t]}</span> ${TIPI[t]}</button>`).join('');
    (s.ass || []).forEach((a, i) => { azioni += `<button class="rosso" data-a="del-ass" data-i="${i}">✕ Elimina ${TIPI[a.tipo]}${a.dal !== a.al ? ` (${dataBreve(a.dal)} – ${dataBreve(a.al)})` : ''}</button>`; });
    pop.innerHTML = `<div class="h">${esc(nomeDip(d))}<small>${esc(dataIt(g))} · ${esc(s.testo)}</small></div>${azioni || '<div class="muted" style="padding:8px;">Nessuna azione.</div>'}`;
    pop.style.display = 'block';
    const r = el.getBoundingClientRect();
    pop.style.left = Math.min(r.left, innerWidth - pop.offsetWidth - 10) + 'px';
    pop.style.top = (r.bottom + pop.offsetHeight + 6 > innerHeight ? r.top - pop.offsetHeight - 6 : r.bottom + 6) + 'px';
    pop.onclick = async (ev) => {
        const b = ev.target.closest('button'); if (!b) return;
        chiudiPop();
        if (b.dataset.a === 'presente') segnaPresente(d.id, g);
        else if (b.dataset.a === 'togli') togliPresenza(s.p);
        else if (b.dataset.a === 'ass') assenzaGiorno(d.id, g, b.dataset.t);
        else if (b.dataset.a === 'del-ass') eliminaAssenza(s.ass[Number(b.dataset.i)]);
    };
}
function chiudiPop() { $('pop').style.display = 'none'; }

const frecceMese = () => `<button class="b b2" data-sposta="-1" title="Mese precedente">‹</button>${selMese()}<button class="b b2" data-sposta="1" title="Mese successivo">›</button>`;

// Scheda generale: tutti i dipendenti per tutti i giorni del mese
function vFoglio() {
    const giorni = giorniMese(meseSel), oggi = OGGI();
    const dips = attivi();
    let corpo = '';
    for (const d of dips) {
        const tot = { P: 0, F: 0, R: 0, EF: 0, M: 0, A: 0, KO: 0 };
        let celle = '';
        for (const g of giorni) {
            const s = statoGiorno(d, g), dow = new Date(g + 'T12:00').getDay();
            if (tot[s.codice] != null) tot[s.codice]++;
            celle += `<td class="g c-${s.codice} ${dow === 0 || dow === 6 ? 'we' : ''} ${g === oggi ? 'oggi' : ''}" data-cella="${d.id}|${g}" title="${esc(dataBreve(g) + ' · ' + s.testo)}"><span class="${s.p && s.p.manuale ? 'manuale' : ''}">${s.sigla}</span></td>`;
        }
        corpo += `<tr><td class="col-nome" title="${esc(orarioTesto(d))}"><span class="nome">${esc(nomeDip(d))}</span><span class="sub">${esc(orarioBreve(d))}</span></td>${celle}
            <td class="tot sep" style="color:var(--P)">${tot.P}</td><td class="tot" style="color:var(--F)">${tot.F}</td><td class="tot" style="color:var(--R)">${tot.R + tot.EF}</td>
            <td class="tot" style="color:var(--M)">${tot.M}</td><td class="tot" style="color:var(--A)">${tot.A}</td><td class="tot" style="color:var(--KO)">${tot.KO}</td></tr>`;
    }
    const testa = giorni.map(g => { const dow = new Date(g + 'T12:00').getDay(); return `<th class="${dow === 0 || dow === 6 ? 'we' : ''} ${g === oggi ? 'oggi' : ''}"><span class="gs">${INIZIALI[dow]}</span>${Number(g.slice(8))}</th>`; }).join('');
    const leg = [['P', 'P', 'Presente'], ['F', 'F', 'Ferie'], ['R', 'R', 'Permesso ROL'], ['EF', 'EF', 'Ex festività'], ['M', 'M', 'Malattia'], ['A', 'A', 'Altra assenza'], ['KO', '✕', 'Assente non giustificato'], ['OFF', '·', 'Non in turno']];
    $('v-foglio').innerHTML = `<div class="titolo"><div><h2>Scheda presenze · ${esc(nomeMese(meseSel))}</h2><p>Clicca una casella per segnare presenza, ferie, permessi o malattia.</p></div>
        <div class="row noprint">${frecceMese()}<button class="b b2" id="f-csv">Esporta CSV</button><button class="b" onclick="print()">Stampa</button></div></div>
        <div class="card"><div class="tab-wrap"><table class="foglio">
            <thead><tr><th class="col-nome">Dipendente</th>${testa}<th class="tot sep" title="Presenze">P</th><th class="tot" title="Ferie">F</th><th class="tot" title="Permessi ROL ed ex festività">R</th><th class="tot" title="Malattia">M</th><th class="tot" title="Altre assenze">A</th><th class="tot" title="Assenze non giustificate">✕</th></tr></thead>
            <tbody>${corpo || `<tr><td class="col-nome muted">Nessun dipendente attivo.</td></tr>`}</tbody>
        </table></div>
        <div class="legenda">${leg.map(([c, s, t]) => `<span><i class="c-${c}">${s}</i>${t}</span>`).join('')}<span>• = presenza segnata a mano</span></div></div>`;
    agganciaMese($('v-foglio'), vFoglio);
    $('v-foglio').querySelectorAll('[data-cella]').forEach(td => td.onclick = (e) => {
        e.stopPropagation();
        const [id, g] = td.dataset.cella.split('|');
        apriPop(td, dip(Number(id)), g);
    });
    $('f-csv').onclick = () => scaricaCsv(`scheda_presenze_${meseSel}.csv`, [
        ['Dipendente', ...giorni.map(g => Number(g.slice(8))), 'Presenze', 'Ferie', 'ROL/Ex fest.', 'Malattia', 'Altre', 'Non giustificate'],
        ...dips.map(d => {
            const s = giorni.map(g => statoGiorno(d, g));
            const c = (k) => s.filter(x => k.includes(x.codice)).length;
            return [nomeDip(d), ...s.map(x => x.codice === 'KO' ? 'X' : x.codice === 'OFF' ? '' : x.sigla), c(['P']), c(['F']), c(['R', 'EF']), c(['M']), c(['A']), c(['KO'])];
        })
    ]);
}

            : '<span class="pill s-KO">Non impostata: le presenze sono bloccate finché non la imposti</span>'}</p>
        <div class="row"><button class="b" id="i-pos">Usa la posizione di questo dispositivo</button>
            <label>Raggio consentito (metri)<input type="number" id="i-raggio" value="${c.raggio}" min="30" max="1000" style="width:120px;"></label>
            <button class="b b2" id="i-raggio-salva">Salva raggio</button></div>
        <p class="muted" style="margin:12px 0 0;">Fallo da un <b>telefono</b>, stando in studio, con il GPS attivo: un PC fisso non ha il GPS e la sua posizione è approssimativa.</p></div>
        <div class="card" style="text-align:center;padding:32px 18px;"><h2 style="margin:0 0 6px;">Registra la tua presenza</h2>
        <p style="margin:0 0 18px;color:var(--testo-2);">Inquadra il QR con la fotocamera del telefono</p>
        <div id="qr"></div><p class="muted" style="word-break:break-all;margin-top:14px;">${esc(url)}</p>
        <div class="row noprint" style="justify-content:center;margin-top:10px;"><button class="b" onclick="print()">Stampa il QR</button>
        <button class="b b2" id="i-nuovoqr">Genera un nuovo QR</button></div></div>`;
    try { new QRCode($('qr'), { text: url, width: 280, height: 280 }); } catch (e) { $('qr').textContent = 'QR non disponibile: usa il link sotto.'; }
    $('i-pos').onclick = () => {
        if (!navigator.geolocation) return alert('Questo dispositivo non fornisce la posizione.');
        navigator.geolocation.getCurrentPosition(async (p) => {
            const acc = Math.round(p.coords.accuracy);
            const avviso = acc > 40 ? `\n\nATTENZIONE: precisione scarsa. Conviene annullare e riprovare da un telefono con GPS, vicino a una finestra.` : '';
            if (!confirm(`Posizione rilevata con precisione di ${acc} m.${avviso}\n\nImpostarla come posizione dello studio?`)) return;
            await api('/presenze/api/config', { method: 'POST', body: JSON.stringify({ studio: { lat: p.coords.latitude, lng: p.coords.longitude } }) });
            toast('Posizione dello studio salvata.'); await ricarica();
        }, (e) => alert('Posizione non disponibile: ' + e.message), { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    };
    $('i-raggio-salva').onclick = async () => { await api('/presenze/api/config', { method: 'POST', body: JSON.stringify({ raggio: $('i-raggio').value }) }); toast('Raggio salvato.'); await ricarica(); };
    $('i-nuovoqr').onclick = async () => {
        if (!confirm('Il QR stampato attuale smetterà di funzionare. Continuare?')) return;
        await api('/presenze/api/config', { method: 'POST', body: JSON.stringify({ nuovoQr: true }) }); await ricarica();
    };
}

const VISTE = { oggi: vOggi, foglio: vFoglio, mese: vMese, assenze: vAssenze, saldi: vSaldi, dip: vDip, imp: vImp };
let vista = 'oggi';
function mostra(v) {
    vista = v; chiudiPop();
    $('nav').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === v));
    Object.keys(VISTE).forEach(k => $('v-' + k).classList.toggle('hidden', k !== v));
    VISTE[v]();
}
$('nav').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) mostra(b.dataset.v); });
async function ricarica() { D = await api('/presenze/api/dati'); VISTE[vista](); }
async function avvia() {
    D = await api('/presenze/api/dati');
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    mostra(vista);
}
if (TOKEN) avvia().catch(() => esci());
setInterval(() => { if (TOKEN && (vista === 'oggi' || vista === 'foglio') && $('pop').style.display !== 'block') ricarica().catch(() => {}); }, 60000);
</script>
</body>
</html>
