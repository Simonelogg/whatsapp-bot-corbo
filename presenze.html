<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenze - Centro Dentale Corbo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Segoe UI, Arial, sans-serif; background: #f1f5f9; color: #0f172a; font-size: 14px; }
    header { background: #0d47a1; color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    header h1 { font-size: 18px; margin: 0; }
    nav button { background: transparent; color: #cfe0ff; border: 0; padding: 8px 10px; font-size: 14px; cursor: pointer; border-radius: 6px; }
    nav button.on { background: rgba(255,255,255,.18); color: #fff; font-weight: 700; }
    main { padding: 16px; max-width: 1300px; margin: 0 auto; }
    .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 16px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 12px; text-transform: uppercase; color: #0d47a1; padding: 8px; background: #f8fafc; white-space: nowrap; }
    td { padding: 8px; border-top: 1px solid #f1f5f9; vertical-align: top; }
    .neg { color: #dc2626; font-weight: 700; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; margin: 1px; }
    .t-ass { background: #fef3c7; color: #92400e; }
    input, select { padding: 7px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    button.b { padding: 7px 12px; border: 0; border-radius: 6px; background: #0d47a1; color: #fff; cursor: pointer; font-size: 14px; }
    button.b2 { background: #e2e8f0; color: #0f172a; } button.del { background: transparent; color: #dc2626; border: 0; cursor: pointer; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
    .row label { display: flex; flex-direction: column; font-size: 12px; color: #475569; gap: 3px; }
    .hidden { display: none; }
    #login { max-width: 320px; margin: 80px auto; }
    #qr { background: #fff; padding: 16px; display: inline-block; }
    .muted { color: #64748b; font-size: 12px; }
    @media print { header, .noprint { display: none !important; } .card { box-shadow: none; } }
</style>
</head>
<body>
<div id="login" class="card">
    <h2 style="margin-top:0;color:#0d47a1;">Presenze</h2>
    <div class="row"><input type="password" id="pwd" placeholder="Password" style="flex:1;"><button class="b" id="btn-login">Entra</button></div>
    <div id="login-err" class="neg"></div>
</div>

<div id="app" class="hidden">
<header>
    <h1>Presenze</h1>
    <nav id="nav">
        <button data-v="oggi" class="on">Oggi</button><button data-v="mese">Mese</button><button data-v="assenze">Ferie e assenze</button>
        <button data-v="saldi">Saldi</button><button data-v="dip">Dipendenti</button><button data-v="imp">Impostazioni</button>
    </nav>
</header>
<main>
    <section id="v-oggi"></section>
    <section id="v-mese" class="hidden"></section>
    <section id="v-assenze" class="hidden"></section>
    <section id="v-saldi" class="hidden"></section>
    <section id="v-dip" class="hidden"></section>
    <section id="v-imp" class="hidden"></section>
</main>
</div>

<script>
let TOKEN = sessionStorage.getItem('presenzeToken') || '';
let D = null; // dati dal server
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const GIORNI = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
const TIPI = { ferie: 'Ferie', rol: 'Permesso ROL', exfest: 'Ex festività', malattia: 'Malattia', altro: 'Altra assenza' };
const num = (n) => (Math.round(n * 100) / 100).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

async function api(url, opt = {}) {
    const r = await fetch(url, Object.assign({}, opt, { headers: { 'Content-Type': 'application/json', 'x-presenze-token': TOKEN } }));
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && url !== '/presenze/api/login') { esci(); throw new Error(j.error || 'Sessione scaduta.'); }
    if (!r.ok) throw new Error(j.error || 'Errore.');
    return j;
}
function esci() { TOKEN = ''; sessionStorage.removeItem('presenzeToken'); $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }
async function login() {
    try {
        const r = await api('/presenze/api/login', { method: 'POST', body: JSON.stringify({ password: $('pwd').value }) });
        TOKEN = r.token; sessionStorage.setItem('presenzeToken', TOKEN);
        await avvia();
    } catch (e) { $('login-err').textContent = e.message; }
}
$('btn-login').addEventListener('click', login);
$('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// ---------- Calcoli (ora locale del browser = ora italiana) ----------
const giorno = (d) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
const dip = (id) => D.dipendenti.find(d => d.id === id);
const nomeDip = (d) => `${d.cognome.toUpperCase()} ${d.nome}`;
function giorniTra(dal, al) { const out = []; for (let d = new Date(dal + 'T12:00'); giorno(d) <= al; d.setDate(d.getDate() + 1)) out.push(giorno(d)); return out; }
// Ore previste in un giorno: null se senza orario fisso
function previste(d, g) {
    const dow = new Date(g + 'T12:00').getDay();
    if (!d.orario) return null;
    return dow === 0 ? 0 : (d.orario[dow] || 0);
}
const lavorativo = (d, g) => { const p = previste(d, g); const dow = new Date(g + 'T12:00').getDay(); return p == null ? (dow >= 1 && dow <= 5) : p > 0; };
const presenza = (id, g) => D.presenze.find(p => p.dip === id && p.giorno === g);
function assenzeDi(id, g) { return D.assenze.filter(a => a.dip === id && a.dal <= g && a.al >= g); }
// Stato di un giorno: presente, assenza registrata, non in turno, oppure assente senza giustificazione
function statoGiorno(d, g) {
    const p = presenza(d.id, g), ass = assenzeDi(d.id, g);
    if (p) return { cls: 'ok', testo: '🟢 Presente' + (p.manuale ? ' (a mano)' : ''), p };
    if (ass.length) return { cls: 'ass', testo: '🟡 ' + ass.map(a => TIPI[a.tipo] + (a.nota ? ': ' + a.nota : '')).join(', ') };
    if (!lavorativo(d, g)) return { cls: 'off', testo: '— non in turno' };
    if (g > giorno(new Date())) return { cls: 'off', testo: '' };
    return { cls: 'ko', testo: '🔴 Assente' };
}
// Consumo di un'assenza sui saldi: ferie in giorni, ROL ed ex festivita' in ore.
// Conta solo i giorni dopo la data dei saldi iniziali. Una "quantita'" indicata a mano vince sul calcolo.
function consumo(a) {
    const d = dip(a.dip); if (!d) return 0;
    const dopo = giorniTra(a.dal, a.al).filter(g => !d.saldi.al || g > d.saldi.al);
    if (!dopo.length) return 0;
    if (a.quantita > 0) return a.quantita;
    const lav = dopo.filter(g => lavorativo(d, g));
    if (a.tipo === 'ferie') return lav.length;
    if (a.tipo === 'rol' || a.tipo === 'exfest') return lav.reduce((s, g) => s + (previste(d, g) ?? 8), 0);
    return lav.length;
}
function saldo(d) {
    const usato = { ferie: 0, rol: 0, exfest: 0, malattia: 0 };
    D.assenze.filter(a => a.dip === d.id && usato[a.tipo] != null).forEach(a => { usato[a.tipo] += consumo(a); });
    return { usato, residuo: { ferie: d.saldi.ferie - usato.ferie, rol: d.saldi.rol - usato.rol, exfest: d.saldi.exfest - usato.exfest } };
}
const orarioTesto = (d) => !d.orario ? 'Senza orario fisso' : [1, 2, 3, 4, 5, 6].filter(g => d.orario[g] > 0).map(g => `${GIORNI[g]} ${d.orario[g]}`).join(' · ') || '—';
const attivi = () => D.dipendenti.filter(d => d.attivo).sort((a, b) => nomeDip(a).localeCompare(nomeDip(b)));
const opzDip = (sel) => attivi().map(d => `<option value="${d.id}" ${d.id === sel ? 'selected' : ''}>${esc(nomeDip(d))}</option>`).join('');

// ---------- Viste ----------
function vOggi() {
    const g = giorno(new Date());
    const lista = attivi().map(d => ({ d, s: statoGiorno(d, g) }));
    const presenti = lista.filter(x => x.s.cls === 'ok').length;
    const righe = lista.map(({ d, s }) => `<tr><td><b>${esc(nomeDip(d))}</b></td><td>${esc(s.testo)}</td><td>${esc(orarioTesto(d))}</td>
        <td>${s.cls === 'ko' ? `<button class="b b2" data-segna="${d.id}">Segna presente</button>` : ''}</td></tr>`).join('');
    $('v-oggi').innerHTML = `<div class="card"><h3 style="margin-top:0;">Oggi, ${new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' })} — ${presenti} presenti</h3>
        <table><tr><th>Dipendente</th><th>Stato</th><th>Turno</th><th></th></tr>${righe}</table></div>`;
    $('v-oggi').querySelectorAll('[data-segna]').forEach(b => b.onclick = () => segnaPresente(Number(b.dataset.segna), g));
}
async function segnaPresente(dipId, g) {
    const nota = prompt('Motivo della presenza segnata a mano (es. telefono scarico)');
    if (nota === null) return;
    try { await api('/presenze/api/presenze', { method: 'POST', body: JSON.stringify({ dip: dipId, giorno: g, nota }) }); await ricarica(); }
    catch (e) { alert(e.message); }
}

let meseSel = giorno(new Date()).slice(0, 7), dipSel = null;
function vMese() {
    if (!dipSel && attivi().length) dipSel = attivi()[0].id;
    const d = dip(dipSel);
    let html = `<div class="card noprint"><div class="row">
        <label>Dipendente<select id="m-dip">${opzDip(dipSel)}</select></label>
        <label>Mese<input type="month" id="m-mese" value="${meseSel}"></label>
        <button class="b b2" id="m-csv">Esporta CSV</button><button class="b b2" onclick="print()">Stampa</button></div></div>`;
    if (!d) { $('v-mese').innerHTML = html; return; }
    const [y, m] = meseSel.split('-').map(Number);
    const ultimo = new Date(y, m, 0).getDate();
    const conta = { ok: 0, ass: 0, ko: 0 };
    let righe = '';
    for (let i = 1; i <= ultimo; i++) {
        const g = `${meseSel}-${String(i).padStart(2, '0')}`;
        const s = statoGiorno(d, g), dow = new Date(g + 'T12:00').getDay();
        if (conta[s.cls] != null) conta[s.cls]++;
        righe += `<tr style="${dow === 0 || dow === 6 ? 'background:#f8fafc;' : ''}"><td>${GIORNI[dow]} ${i}</td>
            <td class="${s.cls === 'ko' ? 'neg' : ''}" title="${esc(s.p ? (s.p.manuale ? 'A mano: ' + (s.p.nota || '') : s.p.dist + ' m dallo studio' + (s.p.acc ? ', precisione ± ' + s.p.acc + ' m' : '')) : '')}">${esc(s.testo)}</td>
            <td class="noprint">${s.p ? `<button class="del" data-del-p="${s.p.id}">Togli presenza</button>`
                : (s.cls === 'ko' || s.cls === 'off') && g <= giorno(new Date()) ? `<button class="del" style="color:#0d47a1;" data-add-p="${g}">Segna presente</button>` : ''}</td></tr>`;
    }
    html += `<div class="card"><h3 style="margin-top:0;">${esc(nomeDip(d))} — ${new Date(y, m - 1).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' })}</h3>
        <p><b>${conta.ok}</b> giorni presente · <b>${conta.ass}</b> giorni con assenza registrata · <b class="${conta.ko ? 'neg' : ''}">${conta.ko}</b> assenze non giustificate</p>
        <table><tr><th>Giorno</th><th>Stato</th><th class="noprint"></th></tr>${righe}</table></div>`;
    $('v-mese').innerHTML = html;
    $('m-dip').onchange = (e) => { dipSel = Number(e.target.value); vMese(); };
    $('m-mese').onchange = (e) => { meseSel = e.target.value; vMese(); };
    $('m-csv').onclick = () => csvMese(d, y, m, ultimo);
    $('v-mese').querySelectorAll('[data-del-p]').forEach(b => b.onclick = async () => {
        if (!confirm('Togliere la presenza di questo giorno?')) return;
        await api('/presenze/api/presenze/' + b.dataset.delP, { method: 'DELETE' }); await ricarica();
    });
    $('v-mese').querySelectorAll('[data-add-p]').forEach(b => b.onclick = () => segnaPresente(d.id, b.dataset.addP));
}
function csvMese(d, y, m, ultimo) {
    const righe = [['Giorno', 'Stato']];
    for (let i = 1; i <= ultimo; i++) {
        const g = `${y}-${String(m).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        righe.push([g, statoGiorno(d, g).testo.replace(/^\S+\s/, '')]);
    }
    const csv = '﻿' + righe.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = `presenze_${d.cognome}_${y}-${String(m).padStart(2, '0')}.csv`;
    a.click();
}

function vAssenze() {
    const oggi = giorno(new Date());
    const lista = D.assenze.slice().sort((a, b) => b.dal.localeCompare(a.dal));
    $('v-assenze').innerHTML = `<div class="card"><h3 style="margin-top:0;">Registra ferie, permessi, malattia</h3>
        <div class="row">
            <label>Dipendente<select id="a-dip">${opzDip(dipSel)}</select></label>
            <label>Tipo<select id="a-tipo">${Object.entries(TIPI).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
            <label>Dal<input type="date" id="a-dal" value="${oggi}"></label>
            <label>Al<input type="date" id="a-al" value="${oggi}"></label>
            <label>Quantità (facoltativa)<input type="number" step="0.5" min="0" id="a-q" style="width:110px;" placeholder="auto"></label>
            <label>Nota<input id="a-nota" placeholder="es. certificato n."></label>
            <button class="b" id="a-salva">Registra</button>
        </div>
        <p class="muted">Ferie in giorni, permessi ROL ed ex festività in ore. Se la quantità è vuota si calcola dall'orario del dipendente (es. un permesso di 2 ore: scrivi 2).</p></div>
        <div class="card"><table><tr><th>Dipendente</th><th>Tipo</th><th>Dal</th><th>Al</th><th>Scala</th><th>Nota</th><th></th></tr>
        ${lista.map(a => { const d = dip(a.dip); return `<tr><td>${d ? esc(nomeDip(d)) : '?'}</td><td><span class="tag t-ass">${TIPI[a.tipo]}</span></td>
            <td>${new Date(a.dal + 'T12:00').toLocaleDateString('it-IT')}</td><td>${new Date(a.al + 'T12:00').toLocaleDateString('it-IT')}</td>
            <td>${a.tipo === 'malattia' || a.tipo === 'altro' ? num(consumo(a)) + ' gg' : num(consumo(a)) + (a.tipo === 'ferie' ? ' gg' : ' h')}</td>
            <td>${esc(a.nota)}</td><td><button class="del" data-del-a="${a.id}">Elimina</button></td></tr>`; }).join('') || '<tr><td colspan="7" class="muted">Nessuna assenza registrata.</td></tr>'}
        </table></div>`;
    $('a-salva').onclick = async () => {
        try {
            await api('/presenze/api/assenze', { method: 'POST', body: JSON.stringify({ dip: Number($('a-dip').value), tipo: $('a-tipo').value, dal: $('a-dal').value, al: $('a-al').value, quantita: Number($('a-q').value) || 0, nota: $('a-nota').value }) });
            await ricarica();
        } catch (e) { alert(e.message); }
    };
    $('v-assenze').querySelectorAll('[data-del-a]').forEach(b => b.onclick = async () => {
        if (!confirm('Eliminare questa assenza? Il saldo viene ricalcolato.')) return;
        await api('/presenze/api/assenze/' + b.dataset.delA, { method: 'DELETE' }); await ricarica();
    });
}

function vSaldi() {
    const anno = new Date().getFullYear();
    const righe = attivi().map(d => {
        const s = saldo(d);
        const cella = (k) => `<td class="${s.residuo[k] < 0 ? 'neg' : ''}"><b>${num(s.residuo[k])}</b><div class="muted">iniz. ${num(d.saldi[k])} − usati ${num(s.usato[k])}</div></td>`;
        const malattia = D.assenze.filter(a => a.dip === d.id && a.tipo === 'malattia' && a.dal.startsWith(String(anno))).reduce((t, a) => t + giorniTra(a.dal, a.al).length, 0);
        return `<tr><td><b>${esc(nomeDip(d))}</b></td><td>${esc(d.cf)}</td><td>${d.saldi.al ? new Date(d.saldi.al + 'T12:00').toLocaleDateString('it-IT') : '—'}</td>
            ${cella('ferie')}${cella('rol')}${cella('exfest')}<td>${malattia}</td></tr>`;
    }).join('');
    $('v-saldi').innerHTML = `<div class="card"><table><tr><th>Cognome e nome</th><th>Codice fiscale</th><th>Saldi iniziali al</th>
        <th>Ferie residue (gg)</th><th>Permessi ROL residui (h)</th><th>Ex festività residue (h)</th><th>Malattia ${anno} (gg)</th></tr>${righe}</table>
        <p class="muted">Residuo = saldo iniziale − assenze registrate dopo quella data. Le maturazioni mensili non sono calcolate: aggiorna i saldi iniziali dalla busta paga in "Dipendenti".</p></div>`;
}

function vDip() {
    const tutti = D.dipendenti.slice().sort((a, b) => (b.attivo - a.attivo) || nomeDip(a).localeCompare(nomeDip(b)));
    $('v-dip').innerHTML = `<div class="card"><div class="row"><button class="b" data-edit="0">+ Nuovo dipendente</button></div>
        <table><tr><th>Cognome e nome</th><th>Orario</th><th>Codice personale</th><th>Telefoni collegati</th><th>Stato</th><th></th></tr>
        ${tutti.map(d => `<tr style="${d.attivo ? '' : 'opacity:.5;'}"><td><b>${esc(nomeDip(d))}</b><div class="muted">${esc(d.cf)}</div></td><td>${esc(orarioTesto(d))}</td>
            <td style="font-family:monospace;font-size:16px;">${esc(d.codice)}</td><td>${d.telefoni}</td><td>${d.attivo ? 'Attivo' : 'Non attivo'}</td>
            <td><button class="b b2" data-edit="${d.id}">Modifica</button></td></tr>`).join('')}</table>
        <p class="muted">Il codice personale serve una volta sola per collegare il telefono del dipendente.</p></div>
        <div class="card hidden" id="dip-form"></div>`;
    $('v-dip').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => formDip(Number(b.dataset.edit)));
}
function formDip(id) {
    const d = dip(id) || { nome: '', cognome: '', cf: '', attivo: true, orario: { 1: 8, 2: 8, 3: 8, 4: 8, 5: 8, 6: 0 }, saldi: { ferie: 0, rol: 0, exfest: 0, al: giorno(new Date()) } };
    const f = $('dip-form');
    f.classList.remove('hidden');
    f.innerHTML = `<h3 style="margin-top:0;">${id ? 'Modifica ' + esc(nomeDip(d)) : 'Nuovo dipendente'}</h3>
        <div class="row"><label>Cognome<input id="f-cognome" value="${esc(d.cognome)}"></label><label>Nome<input id="f-nome" value="${esc(d.nome)}"></label>
            <label>Codice fiscale<input id="f-cf" value="${esc(d.cf)}" maxlength="16"></label>
            <label>Stato<select id="f-attivo"><option value="1">Attivo</option><option value="0" ${d.attivo ? '' : 'selected'}>Non attivo</option></select></label></div>
        <div class="row"><label><span><input type="checkbox" id="f-libero" ${d.orario ? '' : 'checked'}> Senza orario fisso</span></label>
            ${[1, 2, 3, 4, 5, 6].map(g => `<label>${GIORNI[g]} (h)<input type="number" min="0" max="12" step="0.5" class="f-ore" data-g="${g}" value="${d.orario ? d.orario[g] || 0 : 0}" style="width:70px;"></label>`).join('')}</div>
        <div class="row"><label>Saldi aggiornati al<input type="date" id="f-al" value="${d.saldi.al || ''}"></label>
            <label>Ferie (gg)<input type="number" step="0.01" id="f-ferie" value="${d.saldi.ferie}" style="width:100px;"></label>
            <label>ROL (h)<input type="number" step="0.01" id="f-rol" value="${d.saldi.rol}" style="width:100px;"></label>
            <label>Ex festività (h)<input type="number" step="0.01" id="f-exfest" value="${d.saldi.exfest}" style="width:100px;"></label></div>
        <div class="row">${id ? `<label><span><input type="checkbox" id="f-nuovocod"> Genera nuovo codice personale</span></label>
            <label><span><input type="checkbox" id="f-scollega"> Scollega tutti i telefoni (${d.telefoni})</span></label>` : ''}</div>
        <div class="row"><button class="b" id="f-salva">Salva</button><button class="b b2" id="f-annulla">Annulla</button></div>`;
    f.scrollIntoView({ behavior: 'smooth' });
    $('f-annulla').onclick = () => f.classList.add('hidden');
    $('f-salva').onclick = async () => {
        const orario = $('f-libero').checked ? null : Object.fromEntries([...f.querySelectorAll('.f-ore')].map(i => [i.dataset.g, Number(i.value) || 0]));
        try {
            await api('/presenze/api/dipendenti', { method: 'POST', body: JSON.stringify({
                id: id || undefined, nome: $('f-nome').value, cognome: $('f-cognome').value, cf: $('f-cf').value, attivo: $('f-attivo').value === '1', orario,
                saldi: { al: $('f-al').value, ferie: $('f-ferie').value, rol: $('f-rol').value, exfest: $('f-exfest').value },
                nuovoCodice: id ? $('f-nuovocod').checked : false, scollegaTelefoni: id ? $('f-scollega').checked : false }) });
            await ricarica();
        } catch (e) { alert(e.message); }
    };
}

function vImp() {
    const c = D.config;
    const url = `${location.origin}/timbra?k=${c.qrToken}`;
    $('v-imp').innerHTML = `<div class="card noprint"><h3 style="margin-top:0;">Posizione dello studio</h3>
        <p>${c.studio ? `Impostata: ${c.studio.lat.toFixed(5)}, ${c.studio.lng.toFixed(5)} — <a target="_blank" href="https://maps.google.com/?q=${c.studio.lat},${c.studio.lng}">vedi sulla mappa</a>` : '<b class="neg">Non impostata: le presenze sono bloccate finché non la imposti.</b>'}</p>
        <div class="row"><button class="b" id="i-pos">Usa la posizione di questo dispositivo (fallo stando in studio)</button>
            <label>Raggio consentito (metri)<input type="number" id="i-raggio" value="${c.raggio}" min="30" max="1000" style="width:100px;"></label>
            <button class="b b2" id="i-raggio-salva">Salva raggio</button></div>
        <p class="muted">Consiglio: imposta la posizione da un telefono in studio, con il GPS attivo e vicino a una finestra.</p></div>
        <div class="card" style="text-align:center;"><h2>Registra la tua presenza</h2><p>Inquadra il QR con la fotocamera del telefono</p>
        <div id="qr"></div><p class="muted" style="word-break:break-all;">${esc(url)}</p>
        <div class="row noprint" style="justify-content:center;"><button class="b" onclick="print()">Stampa il QR</button>
        <button class="b b2" id="i-nuovoqr">Genera un nuovo QR (il vecchio smette di funzionare)</button></div></div>`;
    try { new QRCode($('qr'), { text: url, width: 260, height: 260 }); } catch (e) { $('qr').textContent = 'QR non disponibile: usa il link sotto.'; }
    $('i-pos').onclick = () => {
        if (!navigator.geolocation) return alert('Questo dispositivo non fornisce la posizione.');
        navigator.geolocation.getCurrentPosition(async (p) => {
            if (!confirm(`Posizione rilevata con precisione di ${Math.round(p.coords.accuracy)} m. Impostarla come posizione dello studio?`)) return;
            await api('/presenze/api/config', { method: 'POST', body: JSON.stringify({ studio: { lat: p.coords.latitude, lng: p.coords.longitude } }) });
            await ricarica();
        }, (e) => alert('Posizione non disponibile: ' + e.message), { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    };
    $('i-raggio-salva').onclick = async () => { await api('/presenze/api/config', { method: 'POST', body: JSON.stringify({ raggio: $('i-raggio').value }) }); await ricarica(); };
    $('i-nuovoqr').onclick = async () => {
        if (!confirm('Il QR stampato attuale smetterà di funzionare. Continuare?')) return;
        await api('/presenze/api/config', { method: 'POST', body: JSON.stringify({ nuovoQr: true }) }); await ricarica();
    };
}

const VISTE = { oggi: vOggi, mese: vMese, assenze: vAssenze, saldi: vSaldi, dip: vDip, imp: vImp };
let vista = 'oggi';
$('nav').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    vista = b.dataset.v;
    $('nav').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    Object.keys(VISTE).forEach(v => $('v-' + v).classList.toggle('hidden', v !== vista));
    VISTE[vista]();
});
async function ricarica() { D = await api('/presenze/api/dati'); VISTE[vista](); }
async function avvia() {
    await ricarica();
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
}
if (TOKEN) avvia().catch(() => esci());
setInterval(() => { if (TOKEN && vista === 'oggi') ricarica().catch(() => {}); }, 60000);
</script>
</body>
</html>
